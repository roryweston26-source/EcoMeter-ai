name: Validate Site

# The website (repo-root *.html) is served straight to GitHub Pages on merge to
# main — there is no build step, so nothing parses the pages before they go live.
# This is that missing gate: it runs on PRs into main so a broken tag, a renamed
# page, or a malformed prices.json is caught BEFORE the merge that deploys.

on:
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - '**.json'
      - 'scripts/validate-site.js'
      - 'scripts/check-auditor.js'
      - 'scripts/test-auditor.js'
      - 'scripts/check-clock.js'
      - 'scripts/check-transparency.js'
      - 'scripts/measure-claude-limits.js'
      - 'scripts/test-limit-ticks.js'
      - 'scripts/test-limit-envelope.js'
      - '.github/workflows/validate-site.yml'
  push:
    branches: [main]        # backstop: also verify what actually landed
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate the static site
        run: node scripts/validate-site.js

      # THE PRICE GUARD, and it should have been here from the start. check-prices.js
      # is what holds prices.json, pricing.html's fallback, sidepanel.js, audit.html and
      # update-prices.js to the same numbers, and it carries the promotional-rate expiry
      # check that exists so "an expired promo cannot quietly become a wrong price".
      # It ran in NO workflow until 2026-09-19. The cost of that was measured: Z.ai's
      # glm-5.3-flash promo expired on 2026-09-09 and the site quoted half the real price
      # for ten days, because the guard was correct and simply never ran. FRESHNESS's own
      # "get the live answer, don't read it" section tells you to run this and
      # check-auditor together; only one of the two was gated.
      - name: Check price data consistency and promo expiry
        run: node scripts/check-prices.js

      # The cost model decides what the Auditor tells someone to pay. Same omission.
      - name: Test cost model
        run: node scripts/test-cost-model.js

      # The water model's PRESENTATION guards live here too -- the range must not
      # collapse to a single number, neither end may exceed two significant figures, and
      # the deleted scope toggle must not return. Those pin the gap between what
      # CLAUDE.md requires and what the panel renders, and they were ungated as well.
      - name: Test water model
        run: node scripts/test-water-model.js

      # The extension's manifest and its PLATFORMS table are a two-copy fact, and the
      # failure mode is silent: a platform in content.js with no content_scripts match
      # never runs, so the panel just stops counting there -- indistinguishable from the
      # DOM-selector rot G1 warns about, except self-inflicted. It also pins the x.com
      # carve-out, which is a PRIVACY property, not an oversight: x.com is Twitter/X and
      # is reached by programmatic injection so the extension is not granted the whole
      # domain. Without a guard, "fixing" that by adding it to matches looks like tidying.
      - name: Check extension manifest consistency
        run: node scripts/check-extension.js

      # The Auditor's data lives in six files that must agree, and its engine
      # recommends what people should pay for. Both are gated here: check-auditor
      # catches price/plan drift between the files, test-auditor sweeps every
      # answer combination and the EcoMeter import for broken recommendations.
      - name: Check Auditor data consistency
        run: node scripts/check-auditor.js

      - name: Test Auditor recommendations
        run: node scripts/test-auditor.js

      # The clock's levels are the one thing no other script judges. validate-site
      # was perfectly happy with a capex level 35% above what four companies had
      # publicly guided, for a whole quarter. This asserts the scenarios still
      # bracket the published totals, that ai-clock.html's fallback copy hasn't
      # drifted, and that the anchor date isn't hardcoded in the prose again.
      - name: Check AI Clock plausibility
        run: node scripts/check-clock.js

      # The Transparency Index makes promises about itself — that every grade links
      # to a source, that its notes are written for a reader rather than a
      # maintainer, and that the tables in the docs match the JSON. On 2026-08-29 a
      # re-read found eight wrong cells across two axes, and every one of them
      # passed validate-site.js. This gates the promises, not the syntax.
      - name: Check Transparency Index consistency
        run: node scripts/check-transparency.js

      # The tick-bracket estimator is how the weekly usage cap gets measured, and its
      # entire claim is "the true cap lies inside this bracket" -- a claim worth nothing
      # unless it has been run against a cap that is already known. The test simulates a
      # meter of known size over a token stream and checks the bracket contains it, then
      # breaks each assumption in turn and checks it stops. It prefers Rory's real
      # transcripts when they are present and falls back to a seeded synthetic stream,
      # so it is not a test that only runs on one machine.
      - name: Test usage-limit tick brackets
        run: node scripts/test-limit-ticks.js

      # The five-hour cap is estimated as an UPPER ENVELOPE, because off-machine usage
      # can only ever make a window's visible units too small. This builds windows from
      # a known cap and a known output weight, hides known fractions of them, and checks
      # the estimator recovers what it should -- then checks it refuses to move when a
      # badly contaminated window is added, which is the whole reason the method changed.
      # The superseded mean-spread estimator runs alongside and is REQUIRED to fail that
      # test, because a change nobody can demonstrate the need for is not an improvement.
      - name: Test five-hour upper-envelope estimator
        run: node scripts/test-limit-envelope.js
